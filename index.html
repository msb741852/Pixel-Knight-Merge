<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pixel Knight: Knockback Update</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style/style.css">
</head>
<body>

    <div id="ability-modal" class="modal-overlay" style="background: rgba(0,0,0,0.9);">
        <div class="modal-box">
            <h3 style="color: #9b59b6; margin-top: 0; margin-bottom: 20px; border-bottom: 2px solid #555; padding-bottom: 10px;">✨ SPECIAL ABILITIES</h3>
            <div style="display: flex; flex-direction: column; gap: 15px; margin-bottom: 20px;">
                <button id="crit-btn" style="height: 100px; font-size: 0.6rem; background: #e74c3c; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 10px;"><span class="ability-icon" style="font-size: 2rem;">💥</span>CRIT<span class="ability-lv">Lv.0</span></button>
                <button id="speed-btn" style="height: 100px; font-size: 0.6rem; background: #f39c12; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 10px;"><span class="ability-icon" style="font-size: 2rem;">⚡</span>SPEED<span class="ability-lv">Lv.0</span></button>
                <button id="damage-btn" style="height: 100px; font-size: 0.6rem; background: #27ae60; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 10px;"><span class="ability-icon" style="font-size: 2rem;">🔥</span>DAMAGE<span class="ability-lv">Lv.0</span></button>
            </div>
            <button style="margin: 0 auto" class="modal-btn" onclick="document.getElementById('ability-modal').style.display='none'">CLOSE</button>
        </div>
    </div>

    <div id="login-modal" class="modal-overlay">
        <h1 style="color:white; text-shadow: 4px 4px 0 #000; margin-bottom: 30px; text-align: center; line-height: 1.5;">PIXEL<br>KNIGHT</h1>
        <input type="text" id="nickname-input" placeholder="NICKNAME" maxlength="8">
        <input type="password" id="password-input" placeholder="PASSWORD (4+ digits)" maxlength="12" style="margin-top: 10px;">
        <button onclick="checkAndStart()" style="width: 80%; max-width: 300px; margin-top: 20px;">GAME START</button>
        <p id="login-msg" style="color: #ff6b6b; font-size: 0.7rem; margin-top: 15px; height: 10px;"></p>
        <p style="color: #ccc; font-size: 0.6rem; margin-top: 30px;">SOUND ON 🔊</p>
    </div>

    <div id="guide-modal" class="modal-overlay" style="background: rgba(0,0,0,0.9);">
        <div class="modal-box">
            <h3 style="color: #fff; margin-bottom: 20px; border-bottom: 2px solid #555; padding-bottom: 10px;">HOW TO PLAY</h3>
            <div class="guide-step"><div class="guide-icon">🖱️</div><div>화면을 <b>클릭</b>해서 공격!<br>(확률적 치명타!)</div></div>
            <div class="guide-step"><div class="guide-icon">💰</div><div>몬스터를 잡고 <b>골드</b> 획득</div></div>
            <div class="guide-step"><div class="guide-icon">🗡️</div><div><b>[WEAPON]</b> 버튼으로 뽑기</div></div>
            <div class="guide-step"><div class="guide-icon">💎</div><div>같은 무기를 <b>드래그</b>해서 합체!</div></div>        <div class="guide-step"><div class="guide-icon">⚡</div><div><b>[스킬]</b> 몬스터 체력 40% 피해<br>(내 DPS×100초와 중 큰값)<br>30초 쿨타임</div></div>            <button class="modal-btn" onclick="closeGuide()" style="background: var(--gold); color: #000; border-color: #fff; width: 100%;">I'M READY!</button>
        </div>
    </div>

    <div id="rank-overlay" class="modal-overlay">
        <div class="modal-box">
            <h3 style="color: gold; margin-top: 0;">HALL OF FAME</h3>
            <div id="rank-list" style="text-align: left; font-size: 0.8rem; line-height: 1.8; min-height: 150px; color: white; margin-bottom: 20px;">Loading...</div>
            <button class="modal-btn" onclick="document.getElementById('rank-overlay').style.display='none'">CLOSE</button>
        </div>
    </div>

    <button id="help-btn" class="top-btn" onclick="openGuide()">❓ HELP</button>
    <button id="rank-btn" class="top-btn" onclick="openRanking()">🏆 RANK</button>

    <div id="stage-area">
        <div class="sky-cloud"></div>
        <div class="ground"></div>
        <div class="stage-ui">
            <div style="margin-bottom: 5px;">🚩 STAGE <span id="stage-num">1</span></div>
            <div>⚔️ DPS: <span id="dps-display">0</span></div>
        </div>
        
        <div id="hero-wrapper" class="actor-wrapper hero-idle">
            <svg viewBox="0 0 12 12" shape-rendering="crispEdges">
                <rect x="5" y="0" width="2" height="1" fill="#e74c3c" /><rect x="4" y="1" width="4" height="3" fill="#95a5a6" /><rect x="5" y="2" width="2" height="1" fill="#000" /><rect x="3" y="4" width="6" height="4" fill="#34495e" /><rect x="5" y="5" width="2" height="2" fill="#bdc3c7" /><rect x="4" y="8" width="1" height="3" fill="#2c3e50" /><rect x="7" y="8" width="1" height="3" fill="#2c3e50" /><rect x="9" y="5" width="1" height="1" fill="#8e44ad" /><rect x="9" y="2" width="1" height="3" fill="#ecf0f1" /><rect x="2" y="5" width="2" height="3" fill="#f1c40f" />
            </svg>
        </div>

        <div id="monster-wrapper" class="actor-wrapper monster-idle">
            <div class="hp-bar-container">
                <div id="monster-hp-bar" class="hp-fill"></div>
                <div id="hp-text"></div>
            </div>
            <!-- 스테이지별 몬스터 형태 -->
            <svg id="monster-svg" viewBox="0 0 12 12" shape-rendering="crispEdges">
                <!-- Form 0: 기본 몬스터 (Stage 1-99) -->
                <g id="monster-form-0">
                    <rect x="2" y="4" width="8" height="7" fill="currentColor" /><rect x="3" y="3" width="6" height="1" fill="currentColor" />
                    <!-- 작은 뿔 -->
                    <rect x="3" y="2" width="1" height="1" fill="currentColor" /><rect x="8" y="2" width="1" height="1" fill="currentColor" />
                    <!-- 눈 -->
                    <g class="eyes-normal">
                        <rect x="3" y="5" width="2" height="2" fill="#ffaa00" /><rect x="7" y="5" width="2" height="2" fill="#ffaa00" />
                        <rect x="4" y="6" width="1" height="1" fill="#000" /><rect x="8" y="6" width="1" height="1" fill="#000" />
                    </g>
                    <g class="eyes-hit" style="display:none">
                        <line x1="3" y1="6" x2="5" y2="6" stroke="#ffff00" stroke-width="1" />
                        <line x1="7" y1="6" x2="9" y2="6" stroke="#ffff00" stroke-width="1" />
                    </g>
                    <!-- 입 -->
                    <rect x="5" y="8" width="2" height="1" fill="#000" />
                </g>

                <!-- Form 1: 뿔 몬스터 (Stage 100-199) -->
                <g id="monster-form-1" style="display:none">
                    <rect x="1" y="5" width="10" height="6" fill="currentColor" /><rect x="2" y="4" width="8" height="1" fill="currentColor" />
                    <!-- 뿔 -->
                    <rect x="2" y="2" width="2" height="2" fill="currentColor" /><rect x="8" y="2" width="2" height="2" fill="currentColor" />
                    <!-- 눈 -->
                    <g class="eyes-normal">
                        <rect x="3" y="5" width="2" height="2" fill="#ffaa00" /><rect x="7" y="5" width="2" height="2" fill="#ffaa00" />
                        <rect x="3" y="5" width="2" height="1" fill="#000" /><rect x="7" y="5" width="2" height="1" fill="#000" />
                    </g>
                    <g class="eyes-hit" style="display:none">
                        <line x1="3" y1="6" x2="5" y2="6" stroke="#ffff00" stroke-width="1" />
                        <line x1="7" y1="6" x2="9" y2="6" stroke="#ffff00" stroke-width="1" />
                    </g>
                    <!-- 입과 이빨 -->
                    <rect x="4" y="8" width="4" height="1" fill="#000" />
                    <rect x="4" y="8" width="1" height="1" fill="#ffff00" /><rect x="7" y="8" width="1" height="1" fill="#ffff00" />
                </g>

                <!-- Form 2: 큰 몬스터 (Stage 200-299) -->
                <g id="monster-form-2" style="display:none">
                    <rect x="0" y="3" width="12" height="8" fill="currentColor" /><rect x="1" y="2" width="10" height="1" fill="currentColor" />
                    <!-- 뿔 -->
                    <rect x="1" y="1" width="2" height="1" fill="currentColor" /><rect x="9" y="1" width="2" height="1" fill="currentColor" />
                    <!-- 눈 -->
                    <g class="eyes-normal">
                        <rect x="2" y="4" width="2" height="2" fill="#ffaa00" /><rect x="8" y="4" width="2" height="2" fill="#ffaa00" />
                        <rect x="2" y="4" width="2" height="1" fill="#000" /><rect x="8" y="4" width="2" height="1" fill="#000" />
                    </g>
                    <g class="eyes-hit" style="display:none">
                        <line x1="2" y1="5" x2="4" y2="5" stroke="#ffff00" stroke-width="1" />
                        <line x1="8" y1="5" x2="10" y2="5" stroke="#ffff00" stroke-width="1" />
                    </g>
                    <!-- 입 -->
                    <rect x="4" y="9" width="4" height="1" fill="#000" />
                </g>

                <!-- Form 3: 큼 (Stage 300-399) -->
                <g id="monster-form-3" style="display:none">
                    <rect x="0" y="4" width="12" height="7" fill="currentColor" /><rect x="1" y="3" width="10" height="1" fill="currentColor" />
                    <!-- 뿔 -->
                    <rect x="1" y="1" width="2" height="2" fill="currentColor" /><rect x="9" y="1" width="2" height="2" fill="currentColor" />
                    <!-- 눈 -->
                    <g class="eyes-normal">
                        <rect x="2" y="5" width="2" height="2" fill="#ffaa00" /><rect x="8" y="5" width="2" height="2" fill="#ffaa00" />
                        <rect x="2" y="5" width="2" height="1" fill="#000" /><rect x="8" y="5" width="2" height="1" fill="#000" />
                    </g>
                    <g class="eyes-hit" style="display:none">
                        <line x1="2" y1="6" x2="4" y2="6" stroke="#ffff00" stroke-width="1" />
                        <line x1="8" y1="6" x2="10" y2="6" stroke="#ffff00" stroke-width="1" />
                    </g>
                    <!-- 입 -->
                    <rect x="3" y="8" width="6" height="1" fill="#000" />
                    <rect x="4" y="8" width="1" height="1" fill="#ffff00" /><rect x="7" y="8" width="1" height="1" fill="#ffff00" />
                </g>

                <!-- Form 4: 보스 (Stage 400+) -->
                <g id="monster-form-4" style="display:none">
                    <rect x="0" y="2" width="12" height="9" fill="currentColor" /><rect x="0" y="2" width="12" height="1" fill="currentColor" />
                    <!-- 뿔 -->
                    <rect x="0" y="0" width="2" height="2" fill="currentColor" /><rect x="10" y="0" width="2" height="2" fill="currentColor" />
                    <!-- 눈 -->
                    <g class="eyes-normal">
                        <rect x="1" y="4" width="3" height="3" fill="#ffaa00" /><rect x="8" y="4" width="3" height="3" fill="#ffaa00" />
                        <rect x="1" y="4" width="3" height="1" fill="#000" /><rect x="8" y="4" width="3" height="1" fill="#000" />
                    </g>
                    <g class="eyes-hit" style="display:none">
                        <line x1="1" y1="6" x2="4" y2="6" stroke="#ffff00" stroke-width="1" />
                        <line x1="8" y1="6" x2="11" y2="6" stroke="#ffff00" stroke-width="1" />
                    </g>
                    <!-- 입 -->
                    <rect x="3" y="8" width="6" height="2" fill="#000" />
                    <rect x="4" y="8" width="1" height="1" fill="#ffff00" /><rect x="6" y="8" width="1" height="1" fill="#ffff00" /><rect x="8" y="8" width="1" height="1" fill="#ffff00" />
                </g>
            </svg>
        </div>
        
        <div id="fever-container" style="width: 200px; height: 16px; background: #222; margin: 5px auto; border: 2px solid #000; position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); border-radius: 8px; overflow: hidden; box-shadow: 0 2px 0 rgba(255,255,255,0.1);">
            <div id="fever-bar" style="width: 0%; height: 100%; background: linear-gradient(90deg, #ff8a00, #e52e71); transition: width 0.1s linear;"></div>
            <div id="fever-text" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
                display: flex; align-items: center; justify-content: center;
                font-size: 0.65rem; color: #fff; font-weight: 900; letter-spacing: 1px;
                text-shadow: 1px 1px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000;">
                FEVER 0%
            </div>
        </div>
        <div id="flash-overlay"></div>
        <!-- 번개 효과 -->
        <div id="lightning-effect" style="position: absolute; pointer-events: none; display: none;"></div>
            <button id="skill-btn-thunder">
                <span class="icon">⚡</span>
                <span class="timer"></span>
            </button>
        </div>
    </div>

    <div id="game-area">
        <div class="stats-bar">
            <span>💰 <span id="gold-display">0</span></span>
            <button id="toggle-inven-btn" style="width: 40px; height: 30px; font-size: 1rem; margin: 0 10px;">▼</button>
            <span id="my-nick-display" style="color: #aaa;">PLAYER</span>
        </div>
        <div id="inven-wrapper">
            <div id="grid"></div>
        </div>
        <div class="controls">
            <button id="toggle-ability-btn" style="margin-bottom:8px; background:#9b59b6; border-color:#8e44ad; box-shadow: 0 4px 0 #71368a;">
                ✨ ABILITIES
            </button>
            <button id="upgrade-btn" style="margin-bottom:8px; background:#9b59b6; border-color:#8e44ad; box-shadow: 0 4px 0 #71368a;">
                UPGRADE Lv.+<br/>(1,000 G)
            </button>
            <button id="buy-btn">WEAPON Lv.+<br/>(10 G)</button>
            <div style="margin-top:8px; font-size:0.6rem; color:#7f8c8d; cursor:pointer;" onclick="resetData()">[RESET DATA]</div>
        </div>
    </div>
    <script type="module" src="./script/script.js"></script>
</body>
</html>
